# Flat loss switches for the root-level WIoU + ProgLoss experiment.
# Training scripts choose the architecture separately, then apply these values
# to wiou_progloss_experiment/wiou_progloss_loss.py at runtime.

loss_name: wiou_progloss

wiou_enabled: true
wiou_alpha: 1.7
wiou_delta: 2.7
wiou_momentum: 0.0001
wiou_focus_min: 0.5
wiou_focus_max: 3.0
wiou_use_distance_gain: true
wiou_distance_gain_max: 1.8
wiou_fallback_base: raw_iou

progloss_enabled: true
progloss_warmup_ratio: 0.10
progloss_ramp_end_ratio: 0.60
progloss_tail_power: 0.5
progloss_tail_lambda_max: 0.8
progloss_tail_weight_min: 0.75
progloss_tail_weight_max: 1.8
# Leave empty here. Training scripts auto-count current train labels and pass
# the result to ProgLoss as progloss_class_counts.
progloss_class_counts:

recommended_training:
  script: wiou_progloss_experiment/train_coffee_edgelite_wiou_progloss.py
  custom_loss_module: wiou_progloss_experiment/wiou_progloss_loss.py
  default_arch: edgelite_bibridge
  supported_arch:
    - native
    - edgelite
    - edgelite_simam
    - edgelite_bibridge
    - edgelite_simam_bibridge
  default_data: coffee_self_sum/coffee_self_sum.yaml
  new_run_name: yolo26n_edgelite_bibridge_wiou_progloss_coffee_self_sum
  smoke_epochs: 3
  full_epochs: 300
  default_imgsz: 960
  default_batch: 64
